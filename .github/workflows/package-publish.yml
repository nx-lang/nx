# Publishes a published GitHub Release made by release.yml: the NuGet and npm packages in one job,
# the VS Code extension to the Marketplace and Open VSX in another, so an outage on one side doesn't
# stop the other. Every registry write skips a version already there, so rerunning a failed job, or
# dispatching with release_tag, repairs a partial publish.

name: Publish release

on:
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published GitHub Release tag to publish or repair
        type: string
        required: true

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
    - name: Validate release tag
      id: release
      shell: bash
      env:
        DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        tag="${DISPATCH_RELEASE_TAG:-${EVENT_RELEASE_TAG}}"
        if [[ -z "${tag}" ]]; then
          echo "::error::release_tag is required."
          exit 1
        fi

        if [[ ! "${tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
          echo "::error::Releases must match v<major>.<minor>.<patch>. Actual tag: ${tag}."
          exit 1
        fi

        is_draft="$(gh release view "${tag}" --json isDraft --jq '.isDraft')"
        if [ "${is_draft}" != "false" ]; then
          echo "::error::Release ${tag} must be published before registry publication."
          exit 1
        fi

        {
          echo "tag=${tag}"
          echo "version=${tag#v}"
        } >> "${GITHUB_OUTPUT}"

  publish-packages:
    name: Publish NuGet and npm packages
    runs-on: ubuntu-latest
    needs: prepare
    environment: production
    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      with:
        fetch-depth: 0
    - name: Download release assets
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/release-assets"
        gh release download "${RELEASE_TAG}" -D "${RUNNER_TEMP}/release-assets" --clobber
        find "${RUNNER_TEMP}/release-assets" -maxdepth 1 -type f -print | sort
    - name: Setup Node.js for npm trusted publishing
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'
        cache: ''
    - name: Upgrade npm for trusted publishing
      run: |
        npm install -g npm@latest
        npm --version
    - name: Validate release assets
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $assets = Join-Path $env:RUNNER_TEMP 'release-assets'
        tools/packaging/Test-ReleaseAssets.ps1 -Path $assets -Tag $env:RELEASE_TAG -Version $env:RELEASE_VERSION

        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $nupkg = @(Get-ChildItem $assets -File -Filter 'NxLang.Sdk.*.nupkg')
        $snupkg = @(Get-ChildItem $assets -File -Filter 'NxLang.Sdk.*.snupkg')
        $tgz = @(Get-ChildItem $assets -File -Filter '*.tgz')

        if ($nupkg.Count -ne 1 -or $snupkg.Count -ne 1 -or $tgz.Count -lt 1) {
            throw 'Releases must include exactly one NxLang.Sdk .nupkg, one .snupkg, and at least one npm .tgz asset.'
        }

        $archive = [System.IO.Compression.ZipFile]::OpenRead($nupkg[0].FullName)
        try {
            $nuspecEntry = $archive.Entries | Where-Object { $_.FullName -like '*.nuspec' } | Select-Object -First 1
            if (!$nuspecEntry) {
                throw "Package '$($nupkg[0].Name)' is missing nuspec metadata."
            }

            $stream = $nuspecEntry.Open()
            try {
                $reader = [System.IO.StreamReader]::new($stream)
                try {
                    [xml] $nuspec = $reader.ReadToEnd()
                } finally {
                    $reader.Dispose()
                }
            } finally {
                $stream.Dispose()
            }

            if ([string] $nuspec.package.metadata.version -ne $env:RELEASE_VERSION) {
                throw "NuGet package version '$($nuspec.package.metadata.version)' does not match release version '$env:RELEASE_VERSION'."
            }
        } finally {
            $archive.Dispose()
        }

        foreach ($package in $tgz) {
            $npmVersion = node -e "const cp=require('node:child_process'); const p=cp.execFileSync('tar',['-xOf',process.argv[1],'package/package.json'],{encoding:'utf8'}); console.log(JSON.parse(p).version)" $package.FullName
            if ($npmVersion -ne $env:RELEASE_VERSION) {
                throw "npm package '$($package.Name)' version '$npmVersion' does not match release version '$env:RELEASE_VERSION'."
            }
        }
    - name: Check NuGet version
      shell: pwsh
      run: |
        $package = Get-ChildItem "$env:RUNNER_TEMP/release-assets/NxLang.Sdk.*.nupkg" | Select-Object -First 1
        tools/packaging/Test-NuGetPackageVersionAvailable.ps1 -PackagePath $package.FullName
    # Every npm tarball in the release, in dependency order; a version already on the registry is
    # skipped, so a rerun of this workflow is an idempotent retry that fills in what is missing.
    - name: Plan npm publication
      run: node scripts/publish-packages.mjs "${RUNNER_TEMP}/release-assets" --version "${RELEASE_VERSION}" --dry-run
    - name: Check npm trusted publishing support
      shell: bash
      run: |
        npm_version="$(npm --version)"
        if node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)" "${npm_version}"; then
          echo "Using npm trusted publishing with npm ${npm_version}."
        else
          echo "::error::Production npm publishing requires trusted publishing with npm >= 11.5.1. Current npm: ${npm_version}."
          exit 1
        fi
    - name: Check NuGet authentication
      id: nuget-auth
      shell: pwsh
      env:
        FALLBACK_NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        if ($env:NUGET_USER) {
            "use_trusted=true" >> $env:GITHUB_OUTPUT
        } elseif ($env:FALLBACK_NUGET_API_KEY) {
            "use_trusted=false" >> $env:GITHUB_OUTPUT
        } else {
            Write-Error "NuGet publishing requires NuGet trusted publishing (NUGET_USER) or NUGET_API_KEY fallback."
        }
    - name: NuGet login
      id: nuget-login
      uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
      if: ${{ steps.nuget-auth.outputs.use_trusted == 'true' }}
      with:
        user: ${{ env.NUGET_USER }}
    - name: Publish NuGet package
      shell: pwsh
      env:
        TRUSTED_NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        FALLBACK_NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        $apiKey = if ($env:TRUSTED_NUGET_API_KEY) { $env:TRUSTED_NUGET_API_KEY } else { $env:FALLBACK_NUGET_API_KEY }
        Get-ChildItem "$env:RUNNER_TEMP/release-assets" -Filter '*.nupkg' | ForEach-Object {
            dotnet nuget push $_.FullName --source https://api.nuget.org/v3/index.json --api-key $apiKey --skip-duplicate
        }
    - name: Publish npm packages
      run: node scripts/publish-packages.mjs "${RUNNER_TEMP}/release-assets" --version "${RELEASE_VERSION}"

  publish-extension:
    name: Publish VS Code extension
    runs-on: ubuntu-latest
    needs: prepare
    environment: production
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
      # For the Marketplace: GitHub's OIDC token signs in as the nx-vscode-publisher managed identity.
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        package_json_file: src/vscode/package.json
        run_install: false
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: src/vscode/pnpm-lock.yaml
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      working-directory: src/vscode
    - name: Download release assets
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/release-assets"
        gh release download "${RELEASE_TAG}" -D "${RUNNER_TEMP}/release-assets" --clobber
        find "${RUNNER_TEMP}/release-assets" -maxdepth 1 -type f -print | sort
    - name: Validate release assets
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $assets = Join-Path $env:RUNNER_TEMP 'release-assets'
        tools/packaging/Test-ReleaseAssets.ps1 -Path $assets -Tag $env:RELEASE_TAG -Version $env:RELEASE_VERSION

        $vsixFiles = @(Get-ChildItem $assets -File -Filter '*.vsix')
        if ($vsixFiles.Count -eq 0) {
            throw 'Releases must include at least one VSIX asset.'
        }

        foreach ($vsix in $vsixFiles) {
            $manifestJson = unzip -p $vsix.FullName extension/package.json | ConvertFrom-Json
            if ($manifestJson.name -ne 'nx-language' -or $manifestJson.publisher -ne 'nx-lang') {
                throw "VSIX '$($vsix.Name)' does not contain the expected nx-lang.nx-language extension identity."
            }

            if ($manifestJson.version -ne $env:RELEASE_VERSION) {
                throw "VSIX '$($vsix.Name)' version '$($manifestJson.version)' does not match release version '$env:RELEASE_VERSION'."
            }
        }
    - name: Check publishing credentials
      shell: bash
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        OVSX_PAT: ${{ secrets.OVSX_PAT }}
      run: |
        missing=0
        for name in AZURE_CLIENT_ID AZURE_TENANT_ID; do
          if [ -z "${!name}" ]; then
            echo "::error::${name} secret is required to sign in to the Visual Studio Marketplace as the nx-vscode-publisher managed identity."
            missing=1
          fi
        done

        if [ -z "${OVSX_PAT}" ]; then
          echo "::error::OVSX_PAT secret is required to publish to Open VSX."
          missing=1
        fi

        exit "${missing}"
    # The Marketplace retires global personal access tokens on 2026-12-01, so it takes a Microsoft
    # Entra ID token for the managed identity instead, which `vsce publish --azure-credential` reads
    # from this sign-in. The identity is a member of the nx-lang publisher; docs/deployment-setup.md
    # has the setup.
    - name: Sign in to Azure as the Marketplace publisher
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        allow-no-subscriptions: true
    - name: Publish to Visual Studio Marketplace
      run: |
        for vsix in "${RUNNER_TEMP}"/release-assets/*.vsix; do
          pnpm run publish:vsce -- "$vsix"
        done
      working-directory: src/vscode
    - name: Publish to Open VSX
      env:
        OVSX_PAT: ${{ secrets.OVSX_PAT }}
      run: |
        for vsix in "${RUNNER_TEMP}"/release-assets/*.vsix; do
          pnpm run publish:ovsx -- "$vsix"
        done
      working-directory: src/vscode
