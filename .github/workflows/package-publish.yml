name: Publish packages

on:
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published package GitHub Release tag to publish or repair
        type: string
        required: true

permissions:
  contents: read

jobs:
  prepare:
    name: Validate package release
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
    - name: Validate release tag
      id: release
      shell: bash
      env:
        DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        tag="${DISPATCH_RELEASE_TAG:-${EVENT_RELEASE_TAG}}"
        if [[ -z "${tag}" ]]; then
          echo "::error::release_tag is required."
          exit 1
        fi

        if [[ "${tag}" =~ ^vscode-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "VS Code release ${tag} is handled by vscode-extension-publish.yml; skipping package publish."
          {
            echo "should_publish=false"
            echo "tag=${tag}"
            echo "version="
          } >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        if [[ ! "${tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
          echo "::error::Package publish releases must match v<major>.<minor>.<patch>. Actual tag: ${tag}."
          exit 1
        fi

        is_draft="$(gh release view "${tag}" --json isDraft --jq '.isDraft')"
        if [ "${is_draft}" != "false" ]; then
          echo "::error::Package release ${tag} must be published before registry publication."
          exit 1
        fi

        {
          echo "should_publish=true"
          echo "tag=${tag}"
          echo "version=${tag#v}"
        } >> "${GITHUB_OUTPUT}"

  publish-production:
    name: Publish production packages
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ needs.prepare.outputs.should_publish == 'true' }}
    environment: production
    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      with:
        fetch-depth: 0
    - name: Download release assets
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/release-assets"
        gh release download "${RELEASE_TAG}" -R "${GITHUB_REPOSITORY}" -D "${RUNNER_TEMP}/release-assets" --clobber
        find "${RUNNER_TEMP}/release-assets" -maxdepth 1 -type f -print | sort
    - name: Setup Node.js for npm trusted publishing
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'
        cache: ''
    - name: Upgrade npm for trusted publishing
      run: |
        npm install -g npm@latest
        npm --version
    - name: Validate release assets
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $assets = Join-Path $env:RUNNER_TEMP 'release-assets'
        $manifestPath = Join-Path $assets 'release-manifest.json'
        $checksumPath = Join-Path $assets 'release-checksums.txt'

        if (!(Test-Path $manifestPath) -or !(Test-Path $checksumPath)) {
            throw 'Release assets must include release-manifest.json and release-checksums.txt.'
        }

        $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
        if ($manifest.schema -ne 'nx.release-manifest.v1' -or $manifest.track -ne 'package' -or $manifest.tag -ne $env:RELEASE_TAG -or $manifest.version -ne $env:RELEASE_VERSION) {
            throw 'Release manifest does not match the package release being published.'
        }

        Push-Location $assets
        try {
            sha256sum -c release-checksums.txt
        } finally {
            Pop-Location
        }

        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $nupkg = @(Get-ChildItem $assets -File -Filter 'NxLang.Sdk.*.nupkg')
        $snupkg = @(Get-ChildItem $assets -File -Filter 'NxLang.Sdk.*.snupkg')
        $tgz = @(Get-ChildItem $assets -File -Filter '*.tgz')

        if ($nupkg.Count -ne 1 -or $snupkg.Count -ne 1 -or $tgz.Count -ne 1) {
            throw 'Package releases must include exactly one NxLang.Sdk .nupkg, one .snupkg, and one npm .tgz asset.'
        }

        $archive = [System.IO.Compression.ZipFile]::OpenRead($nupkg[0].FullName)
        try {
            $nuspecEntry = $archive.Entries | Where-Object { $_.FullName -like '*.nuspec' } | Select-Object -First 1
            if (!$nuspecEntry) {
                throw "Package '$($nupkg[0].Name)' is missing nuspec metadata."
            }

            $stream = $nuspecEntry.Open()
            try {
                $reader = [System.IO.StreamReader]::new($stream)
                try {
                    [xml] $nuspec = $reader.ReadToEnd()
                } finally {
                    $reader.Dispose()
                }
            } finally {
                $stream.Dispose()
            }

            if ([string] $nuspec.package.metadata.version -ne $env:RELEASE_VERSION) {
                throw "NuGet package version '$($nuspec.package.metadata.version)' does not match release version '$env:RELEASE_VERSION'."
            }
        } finally {
            $archive.Dispose()
        }

        $npmVersion = node -e "const cp=require('node:child_process'); const p=cp.execFileSync('tar',['-xOf',process.argv[1],'package/package.json'],{encoding:'utf8'}); console.log(JSON.parse(p).version)" $tgz[0].FullName
        if ($npmVersion -ne $env:RELEASE_VERSION) {
            throw "npm package version '$npmVersion' does not match release version '$env:RELEASE_VERSION'."
        }
    - name: Check NuGet version
      shell: pwsh
      run: |
        $package = Get-ChildItem "$env:RUNNER_TEMP/release-assets/NxLang.Sdk.*.nupkg" | Select-Object -First 1
        tools/packaging/Test-NuGetPackageVersionAvailable.ps1 -PackagePath $package.FullName
    - name: Check npm version
      id: npm-version
      run: |
        package=$(find "${RUNNER_TEMP}/release-assets" -maxdepth 1 -name '*.tgz' -type f -print -quit)
        name=$(node -e "const p=require('child_process').execFileSync('tar',['-xOf',process.argv[1],'package/package.json'],{encoding:'utf8'}); console.log(JSON.parse(p).name)" "$package")
        package_version=$(node -e "const p=require('child_process').execFileSync('tar',['-xOf',process.argv[1],'package/package.json'],{encoding:'utf8'}); console.log(JSON.parse(p).version)" "$package")
        if npm view "${name}@${package_version}" version >/dev/null 2>&1; then
          echo "::warning::${name}@${package_version} already exists on npm; treating this run as an idempotent retry."
          echo "exists=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "exists=false" >> "$GITHUB_OUTPUT"
        echo "npm package ${name}@${package_version} is available."
    - name: Check npm trusted publishing support
      shell: bash
      run: |
        npm_version="$(npm --version)"
        if node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)" "${npm_version}"; then
          echo "Using npm trusted publishing with npm ${npm_version}."
        else
          echo "::error::Production npm publishing requires trusted publishing with npm >= 11.5.1. Current npm: ${npm_version}."
          exit 1
        fi
    - name: Check NuGet authentication
      id: nuget-auth
      shell: pwsh
      env:
        FALLBACK_NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        if ($env:NUGET_USER) {
            "use_trusted=true" >> $env:GITHUB_OUTPUT
        } elseif ($env:FALLBACK_NUGET_API_KEY) {
            "use_trusted=false" >> $env:GITHUB_OUTPUT
        } else {
            Write-Error "NuGet publishing requires NuGet trusted publishing (NUGET_USER) or NUGET_API_KEY fallback."
        }
    - name: NuGet login
      id: nuget-login
      uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
      if: ${{ steps.nuget-auth.outputs.use_trusted == 'true' }}
      with:
        user: ${{ env.NUGET_USER }}
    - name: Publish NuGet package
      shell: pwsh
      env:
        TRUSTED_NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        FALLBACK_NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        $apiKey = if ($env:TRUSTED_NUGET_API_KEY) { $env:TRUSTED_NUGET_API_KEY } else { $env:FALLBACK_NUGET_API_KEY }
        Get-ChildItem "$env:RUNNER_TEMP/release-assets" -Filter '*.nupkg' | ForEach-Object {
            dotnet nuget push $_.FullName --source https://api.nuget.org/v3/index.json --api-key $apiKey --skip-duplicate
        }
    - name: Publish editor-assets package
      if: ${{ steps.npm-version.outputs.exists != 'true' }}
      run: |
        package=$(find "${RUNNER_TEMP}/release-assets" -maxdepth 1 -name '*.tgz' -type f -print -quit)
        npm publish "$package" --access public --provenance
