# Releases NX from a v<major>.<minor>.<patch> tag: the NuGet package, every npm package and a VSIX
# per VS Code extension target, all at the tag's version, attached to one draft GitHub Release.
# Publishing that release runs package-publish.yml.

name: Release

on:
  push:
    tags:
    # Only v<major>.<minor>.<patch>, so a tag of the retired vscode-v* track starts no run.
    - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild as a draft release
        type: string
        required: true

run-name: Release ${{ inputs.tag || github.ref_name }}

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  BUILDCONFIGURATION: Release
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages/

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
    - name: Validate tag
      id: tag
      shell: bash
      env:
        DISPATCH_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail

        tag="${DISPATCH_TAG:-${GITHUB_REF_NAME}}"
        if [[ ! "${tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
          echo "::error::Release tags must match v<major>.<minor>.<patch>. Actual tag: ${tag}."
          exit 1
        fi

        {
          echo "tag=${tag}"
          echo "version=${tag#v}"
        } >> "${GITHUB_OUTPUT}"

  native-sdk:
    name: Build native SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-14
        - windows-2022
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      with:
        fetch-depth: 0
        ref: ${{ needs.validate.outputs.tag }}
    - name: Install prerequisites
      run: |
        ./init.ps1 -UpgradePrerequisites
        dotnet --info
      shell: pwsh
    - name: Stage NX native SDK
      run: tools/packaging/Stage-NxSdkNativeArtifact.ps1 -Configuration ${{ env.BUILDCONFIGURATION }}
      shell: pwsh
    - name: Upload NX native SDK artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: nx-sdk-native-${{ runner.os }}
        path: artifacts/nx-sdk
        if-no-files-found: error

  package:
    name: Build NuGet package
    runs-on: ubuntu-latest
    needs:
    - validate
    - native-sdk
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      with:
        fetch-depth: 0
        ref: ${{ needs.validate.outputs.tag }}
    - name: Install prerequisites
      run: |
        ./init.ps1 -UpgradePrerequisites
        dotnet --info
      shell: pwsh
    - name: Calculate package version
      id: versions
      shell: pwsh
      run: >
        tools/versions/Get-ReleaseVersion.ps1
        -Context tag
        -RefName '${{ needs.validate.outputs.tag }}'
        -GitHubEnvPath $env:GITHUB_ENV
        -GitHubOutputPath $env:GITHUB_OUTPUT
    - name: Download NX native SDK artifacts
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        pattern: nx-sdk-native-*
        path: artifacts/nx-sdk
        merge-multiple: true
    - name: Pack NxLang.Sdk
      run: >
        dotnet pack bindings/dotnet/src/NxLang.Sdk/NxLang.Sdk.csproj
        -c ${{ env.BUILDCONFIGURATION }}
        -warnAsError
        -warnNotAsError:NU1901,NU1902,NU1903,NU1904
        -p:Version="${{ steps.versions.outputs.package_version }}"
        -p:PackageVersion="${{ steps.versions.outputs.package_version }}"
        -p:ContinuousIntegrationBuild=true
    - name: Verify NxLang.Sdk package
      run: |
        $package = Get-ChildItem bin/Packages/${{ env.BUILDCONFIGURATION }}/NxLang.Sdk.*.nupkg | Select-Object -First 1
        tools/packaging/Test-NxSdkPackage.ps1 -PackagePath $package.FullName
      shell: pwsh
    - name: Upload package artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: package-release-nuget
        path: |
          bin/Packages/${{ env.BUILDCONFIGURATION }}/*.nupkg
          bin/Packages/${{ env.BUILDCONFIGURATION }}/*.snupkg
        if-no-files-found: error

  editor-assets:
    name: Build editor-assets package
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: src/vscode
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      with:
        fetch-depth: 0
        ref: ${{ needs.validate.outputs.tag }}
    - name: Restore .NET tools
      run: dotnet tool restore
      working-directory: .
    - name: Set editor package version
      shell: pwsh
      run: >
        tools/versions/Get-ReleaseVersion.ps1
        -Context tag
        -RefName '${{ needs.validate.outputs.tag }}'
        -GitHubEnvPath $env:GITHUB_ENV
      working-directory: .
    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        package_json_file: src/vscode/package.json
        run_install: false
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: src/vscode/pnpm-lock.yaml
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Package editor assets
      run: pnpm run package:language
    - name: Verify editor-assets package
      run: |
        package=$(find dist -maxdepth 1 -name '*.tgz' -type f -print -quit)
        pnpm run verify:package "$package"
        pnpm run smoke:package "$package"
    - name: Upload editor-assets package
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: package-release-editor-assets
        path: src/vscode/dist/*.tgz
        if-no-files-found: error

  npm-packages:
    name: Build npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      with:
        fetch-depth: 0
        ref: ${{ needs.validate.outputs.tag }}
    - name: Set up Rust and the pnpm workspace
      uses: ./.github/actions/setup-rust-node
    - name: Build the workspace, including the WebAssembly module
      run: pnpm -r build
    # The module that ships inside @nx-lang/sdk-wasm is the one the parity tests ran against.
    - name: Test the pnpm workspace
      run: pnpm -r test
    - name: Verify and pack the npm packages
      run: |
        pnpm run verify:packages
        node scripts/pack-packages.mjs "${{ needs.validate.outputs.version }}" "${{ runner.temp }}/npm-packages"
    - name: Upload npm packages
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: package-release-npm
        path: ${{ runner.temp }}/npm-packages/*.tgz
        if-no-files-found: error

  vsix:
    needs: validate
    uses: ./.github/workflows/vscode-vsix.yml
    with:
      release_tag: ${{ needs.validate.outputs.tag }}

  draft-release:
    name: Create draft GitHub Release
    runs-on: ubuntu-latest
    needs:
    - validate
    - package
    - editor-assets
    - npm-packages
    - vsix
    permissions:
      actions: read
      contents: write
    steps:
    - name: Download NuGet release artifacts
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: package-release-nuget
        path: ${{ runner.temp }}/nuget
    - name: Download editor-assets release artifact
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: package-release-editor-assets
        path: ${{ runner.temp }}/editor-assets
    - name: Download npm release artifacts
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: package-release-npm
        path: ${{ runner.temp }}/npm-packages
    # One vscode-vsix-<target> artifact per target in vscode-vsix.yml's matrix, each in its own
    # directory, so the check below learns the targets from the matrix instead of repeating them.
    - name: Download VSIX release artifacts
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        pattern: vscode-vsix-*
        path: ${{ runner.temp }}/vsix
    - name: Create manifest and checksums
      shell: pwsh
      env:
        RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      run: |
        $ErrorActionPreference = 'Stop'
        $releaseAssets = Join-Path $env:RUNNER_TEMP 'release-assets'
        New-Item -ItemType Directory -Force -Path $releaseAssets | Out-Null

        Get-ChildItem "$env:RUNNER_TEMP/nuget" -File -Include '*.nupkg', '*.snupkg' -Recurse | Copy-Item -Destination $releaseAssets
        Get-ChildItem "$env:RUNNER_TEMP/editor-assets" -File -Filter '*.tgz' -Recurse | Copy-Item -Destination $releaseAssets
        Get-ChildItem "$env:RUNNER_TEMP/npm-packages" -File -Filter '*.tgz' -Recurse | Copy-Item -Destination $releaseAssets
        Get-ChildItem "$env:RUNNER_TEMP/vsix" -File -Filter '*.vsix' -Recurse | Copy-Item -Destination $releaseAssets

        $nupkg = @(Get-ChildItem $releaseAssets -File -Filter '*.nupkg')
        $snupkg = @(Get-ChildItem $releaseAssets -File -Filter '*.snupkg')
        $tgz = @(Get-ChildItem $releaseAssets -File -Filter '*.tgz')
        $vsix = @(Get-ChildItem $releaseAssets -File -Filter '*.vsix')

        if ($nupkg.Count -eq 0 -or $snupkg.Count -eq 0 -or $tgz.Count -lt 2) {
            throw 'Releases require .nupkg, .snupkg, the editor-assets .tgz and the workspace npm .tgz assets.'
        }

        $vsixArtifacts = @(Get-ChildItem "$env:RUNNER_TEMP/vsix" -Directory -Filter 'vscode-vsix-*')
        if ($vsixArtifacts.Count -eq 0) {
            throw 'Releases require a VSIX for every VS Code extension target.'
        }

        foreach ($artifact in $vsixArtifacts) {
            $target = $artifact.Name.Substring('vscode-vsix-'.Length)
            if (!($vsix | Where-Object Name -eq "nx-language-$target-$env:RELEASE_VERSION.vsix")) {
                throw "Releases require the $target VSIX at version $env:RELEASE_VERSION."
            }
        }

        $artifacts = @(Get-ChildItem $releaseAssets -File | Sort-Object Name | ForEach-Object {
            [ordered] @{
                name = $_.Name
                size = $_.Length
                sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
        })

        $manifest = [ordered] @{
            schema = 'nx.release-manifest.v1'
            tag = $env:RELEASE_TAG
            version = $env:RELEASE_VERSION
            commit = $env:GITHUB_SHA
            artifacts = $artifacts
        }

        $manifestPath = Join-Path $releaseAssets 'release-manifest.json'
        $checksumPath = Join-Path $releaseAssets 'release-checksums.txt'
        $manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $manifestPath
        $artifacts | ForEach-Object { "$($_.sha256)  $($_.name)" } | Set-Content -LiteralPath $checksumPath
    - name: Create or update draft release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      run: |
        set -euo pipefail

        notes="${RUNNER_TEMP}/release-notes.md"
        cat > "${notes}" <<EOF
        Draft release for ${RELEASE_TAG}.

        Review the attached NuGet, symbol, npm (editor assets and workspace packages), VS Code extension VSIX, manifest, and checksum assets before publishing this GitHub Release.
        Publishing the release publishes them to NuGet, npm, the Visual Studio Marketplace and Open VSX.
        EOF

        if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
          is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft')"
          if [ "${is_draft}" != "true" ]; then
            echo "::error::Release ${RELEASE_TAG} already exists and is not a draft."
            exit 1
          fi
          gh release edit "${RELEASE_TAG}" --draft=true --title "NX ${RELEASE_VERSION}" --notes-file "${notes}"
        else
          gh release create "${RELEASE_TAG}" --draft --title "NX ${RELEASE_VERSION}" --notes-file "${notes}"
        fi

        gh release upload "${RELEASE_TAG}" "${RUNNER_TEMP}/release-assets/"* --clobber
