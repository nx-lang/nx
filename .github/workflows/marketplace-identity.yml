# Signs in as the nx-vscode-publisher managed identity, prints its Azure DevOps id, and checks that
# the identity may publish to the nx-lang publisher, without publishing anything. The Marketplace
# only accepts that id to add the identity as a member (it then lists it as <tenant id>\<object id>),
# so the check fails until the id is added. Run it when setting up or replacing the identity, or
# before a release (docs/deployment-setup.md, "Visual Studio Marketplace publishing identity").

name: Check Marketplace identity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check the publishing identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The identity trusts GitHub's OIDC token only for jobs in this environment.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Sign in to Azure as the Marketplace publisher
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        allow-no-subscriptions: true
    # 499b84ac-1321-427f-aa17-267ca6975798 is Azure DevOps, which the Marketplace runs on.
    - name: Look up the identity's Azure DevOps profile
      shell: bash
      run: |
        set -euo pipefail
        id=$(az rest --method get \
          --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
          --resource 499b84ac-1321-427f-aa17-267ca6975798 \
          --query id --output tsv)
        echo "Marketplace member id: ${id}"
        {
          echo "Add this id as a **Contributor** member of the \`nx-lang\` publisher at"
          echo "https://marketplace.visualstudio.com/manage/publishers/nx-lang (Members):"
          echo ""
          echo "\`${id}\`"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24'
    # Fails unless the identity is a member of nx-lang with publish rights.
    - name: Check the identity may publish to nx-lang
      run: npx --yes @vscode/vsce@3.7.0 verify-pat --azure-credential nx-lang
