name: Graphics native
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/**'
      - 'examples/graphics/**'
      - 'runtime/typescript/**'
      - 'scripts/*graphics*'
      - 'schemas/**'
      - 'evaluations/**'
      - '.github/workflows/graphics-native.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

jobs:
  linux-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y clang ninja-build libfontconfig1-dev
      - run: cargo test --locked -p nx-graphics -p nx-graphics-skia --features nx-graphics-skia/preview
      - run: cargo build --locked -p nx-graphics-skia --features preview --bin nx-graphics-preview
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install jsonschema==4.25.1
      - run: node scripts/verify-graphics-fixtures.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p nx-graphics-skia --features preview --all-targets -- -D warnings
      - run: python3 scripts/check-graphics-preview.py
