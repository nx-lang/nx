name: 🏭 Build

on:
  push:
    branches:
    - main
    - 'v*.*'
    - validate/*
  pull_request:
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  BUILDCONFIGURATION: Release
  # codecov_token: 4dc9e7e2-6b01-4932-a180-847b52b43d35 # Get a new one from https://codecov.io/
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages/

permissions:
  contents: read

jobs:
  build:
    name: 🏭 Build

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-14
        - windows-2022

    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      with:
        fetch-depth: 0 # MinVer needs tag history for version calculation.
    - name: ⚙ Install prerequisites
      run: |
        ./init.ps1 -UpgradePrerequisites
        dotnet --info

        # Print mono version if it is present.
        if (Get-Command mono -ErrorAction SilentlyContinue) {
          mono --version
        }
      shell: pwsh
    - name: ⚙️ Set pipeline variables based on source
      run: tools/variables/_define.ps1
      shell: pwsh
    - name: 🛠 Build NX native runtime
      run: tools/packaging/Stage-NxRuntimeNativeArtifact.ps1 -Configuration ${{ env.BUILDCONFIGURATION }}
      shell: pwsh
    - name: 🛠 build
      run: dotnet build bindings/dotnet/NxLang.sln -t:build --no-restore -c ${{ env.BUILDCONFIGURATION }} -warnAsError -warnNotAsError:NU1901,NU1902,NU1903,NU1904 /bl:"${{ runner.temp }}/_artifacts/build_logs/build.binlog"
    - name: 🧪 test
      run: tools/dotnet-test-cloud.ps1 -Configuration ${{ env.BUILDCONFIGURATION }} -Agent ${{ runner.os }}
      shell: pwsh
    - name: 💅🏻 Verify formatted code
      run: dotnet format bindings/dotnet/NxLang.sln --verify-no-changes --no-restore
      shell: pwsh
      if: runner.os == 'Linux'
    - name: ⚙ Update pipeline variables based on build outputs
      run: tools/variables/_define.ps1
      shell: pwsh
    - name: 📢 Publish artifacts
      uses: ./.github/actions/publish-artifacts
      if: cancelled() == false
    - name: 📢 Upload NX native runtime artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: nx-runtime-native-${{ runner.os }}
        path: artifacts/nx-runtime
      if: cancelled() == false
    - name: 📢 Publish code coverage results to codecov.io
      run: ./tools/publish-CodeCov.ps1 -CodeCovToken "${{ env.codecov_token }}" -PathToCodeCoverage "${{ runner.temp }}/_artifacts/coverageResults" -Name "${{ runner.os }} Coverage Results" -Flags "${{ runner.os }}"
      shell: pwsh
      timeout-minutes: 3
      continue-on-error: true
      if: env.codecov_token != ''

  package:
    name: 📦 Package
    runs-on: ubuntu-latest
    needs: build
    outputs:
      package_version: ${{ steps.versions.outputs.package_version }}
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      with:
        fetch-depth: 0
    - name: ⚙ Install prerequisites
      run: |
        ./init.ps1 -UpgradePrerequisites
        dotnet --info
      shell: pwsh
    - name: ⚙️ Set pipeline variables based on source
      run: tools/variables/_define.ps1
      shell: pwsh
    - name: ⚙ Calculate package versions
      id: versions
      shell: pwsh
      run: >
        tools/versions/Get-ReleaseVersion.ps1
        -Track package
        -PullRequestNumber '${{ github.event.pull_request.number }}'
        -GitHubEnvPath $env:GITHUB_ENV
        -GitHubOutputPath $env:GITHUB_OUTPUT
    - name: 🔻 Download NX native runtime artifacts
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        pattern: nx-runtime-native-*
        path: artifacts/nx-runtime
        merge-multiple: true
    - name: 📦 Pack NxLang.Runtime
      run: >
        dotnet pack bindings/dotnet/src/NxLang.Runtime/NxLang.Runtime.csproj
        -c ${{ env.BUILDCONFIGURATION }}
        -warnAsError
        -warnNotAsError:NU1901,NU1902,NU1903,NU1904
        -p:Version="${{ steps.versions.outputs.package_version }}"
        -p:PackageVersion="${{ steps.versions.outputs.package_version }}"
        -p:ContinuousIntegrationBuild=true
    - name: 🔎 Verify NxLang.Runtime package
      run: |
        $package = Get-ChildItem bin/Packages/${{ env.BUILDCONFIGURATION }}/NxLang.Runtime.*.nupkg | Select-Object -First 1
        tools/packaging/Test-NxRuntimePackage.ps1 -PackagePath $package.FullName
      shell: pwsh
    - name: 📢 Upload complete deployables
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: deployables-Complete
        path: bin/Packages/${{ env.BUILDCONFIGURATION }}

  smoke-test-package:
    name: 🧪 Package smoke test
    runs-on: ${{ matrix.os }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          rid: linux-x64
        - os: macos-14
          rid: osx-arm64
        - os: windows-2022
          rid: win-x64
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      with:
        fetch-depth: 0
    - name: ⚙ Install prerequisites
      run: |
        ./init.ps1 -UpgradePrerequisites
        dotnet --info
      shell: pwsh
    - name: 🔻 Download complete deployables
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: deployables-Complete
        path: ${{ runner.temp }}/deployables
    - name: 🧪 Smoke-test NxLang.Runtime package
      run: |
        $package = Get-ChildItem '${{ runner.temp }}/deployables/NxLang.Runtime.*.nupkg' | Select-Object -First 1
        tools/packaging/SmokeTest-NxRuntimePackage.ps1 -PackagePath $package.FullName -RuntimeIdentifier ${{ matrix.rid }}
      shell: pwsh

  editor-assets:
    name: 📦 Editor assets
    runs-on: ubuntu-latest
    outputs:
      npm_package_version: ${{ steps.versions.outputs.npm_package_version }}
    defaults:
      run:
        working-directory: src/vscode
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      with:
        fetch-depth: 0
    - name: Restore .NET tools
      run: ./init.ps1 -NoPrerequisites -NoRestore
      shell: pwsh
      working-directory: .
    - name: Set editor package version
      id: versions
      shell: pwsh
      run: >
        tools/versions/Get-ReleaseVersion.ps1
        -Track package
        -PullRequestNumber '${{ github.event.pull_request.number }}'
        -GitHubEnvPath $env:GITHUB_ENV
        -GitHubOutputPath $env:GITHUB_OUTPUT
      working-directory: .
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        package_json_file: src/vscode/package.json
        run_install: false
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: src/vscode/pnpm-lock.yaml
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Package editor assets
      run: pnpm run package:language
    - name: Verify editor-assets package
      run: |
        package=$(find dist -maxdepth 1 -name '*.tgz' -type f -print -quit)
        pnpm run verify:package "$package"
        pnpm run smoke:package "$package"
    - name: Upload editor-assets package
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: editor-assets-package
        path: src/vscode/dist/*.tgz

  package-pr-metadata:
    name: 📝 Package PR test commands
    runs-on: ubuntu-latest
    needs:
    - package
    - smoke-test-package
    - editor-assets
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
    - name: Generate package test metadata
      shell: bash
      env:
        NPM_PACKAGE_VERSION: ${{ needs.editor-assets.outputs.npm_package_version }}
        PACKAGE_VERSION: ${{ needs.package.outputs.package_version }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
      run: |
        mkdir -p pr-test-commands
        nuget_download="gh run download ${RUN_ID} -R ${REPOSITORY} -n deployables-Complete -D nx-package-artifacts"
        nuget_install="dotnet add <PROJECT.csproj> package NxLang.Runtime --version ${PACKAGE_VERSION} --source \"\$(pwd)/nx-package-artifacts\""
        npm_download="gh run download ${RUN_ID} -R ${REPOSITORY} -n editor-assets-package -D nx-editor-assets"
        npm_install="pnpm add ./nx-editor-assets/*.tgz"

        jq -n \
          --arg schema "nx.package-pr-artifacts.v1" \
          --arg repository "${REPOSITORY}" \
          --argjson pullRequest "${PR_NUMBER}" \
          --argjson runId "${RUN_ID}" \
          --arg packageVersion "${PACKAGE_VERSION}" \
          --arg npmPackageVersion "${NPM_PACKAGE_VERSION}" \
          --arg nugetArtifact "deployables-Complete" \
          --arg npmArtifact "editor-assets-package" \
          --arg nugetDownload "${nuget_download}" \
          --arg nugetInstall "${nuget_install}" \
          --arg npmDownload "${npm_download}" \
          --arg npmInstall "${npm_install}" \
          '{
            schema: $schema,
            repository: $repository,
            pullRequest: $pullRequest,
            runId: $runId,
            artifacts: {
              nuget: $nugetArtifact,
              npm: $npmArtifact
            },
            versions: {
              nuget: $packageVersion,
              npm: $npmPackageVersion
            },
            commands: {
              nuget: [$nugetDownload, $nugetInstall],
              npm: [$npmDownload, $npmInstall]
            }
          }' > pr-test-commands/metadata.json
    - name: Upload package test metadata
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: package-pr-test-commands
        path: pr-test-commands/metadata.json
        if-no-files-found: error
