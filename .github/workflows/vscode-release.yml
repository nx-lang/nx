name: VS Code extension release

on:
  push:
    tags:
    - 'vscode-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: VS Code release tag to rebuild as a draft release
        type: string
        required: true

run-name: VS Code release ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  validate:
    name: Validate VS Code release tag
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.tag.outputs.should_release }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
    - name: Validate tag
      id: tag
      shell: bash
      env:
        DISPATCH_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail

        tag="${DISPATCH_TAG:-${GITHUB_REF_NAME}}"
        if [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Package release tag ${tag} is handled by release.yml; skipping VS Code release."
          {
            echo "should_release=false"
            echo "tag=${tag}"
            echo "version="
          } >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        if [[ ! "${tag}" =~ ^vscode-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
          echo "::error::VS Code release tags must match vscode-v<major>.<minor>.<patch>. Actual tag: ${tag}."
          exit 1
        fi

        {
          echo "should_release=true"
          echo "tag=${tag}"
          echo "version=${tag#vscode-v}"
        } >> "${GITHUB_OUTPUT}"

  package:
    name: Package VSIX (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: validate
    if: ${{ needs.validate.outputs.should_release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: linux-x64
          os: ubuntu-latest
        - target: darwin-arm64
          os: macos-14
        - target: win32-x64
          os: windows-latest
    env:
      NX_LSP_PLATFORM: ${{ matrix.target }}
      NX_VSCODE_TARGET: ${{ matrix.target }}
    defaults:
      run:
        working-directory: src/vscode
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ needs.validate.outputs.tag }}
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        package_json_file: src/vscode/package.json
        run_install: false
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: src/vscode/pnpm-lock.yaml
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Restore .NET tools
      run: dotnet tool restore
      working-directory: .
    - name: Calculate VS Code extension version
      shell: pwsh
      run: >
        tools/versions/Get-ReleaseVersion.ps1
        -Track vscode
        -Context tag
        -RefName '${{ needs.validate.outputs.tag }}'
        -GitHubEnvPath $env:GITHUB_ENV
      working-directory: .
    - name: Build Rust language server
      run: pnpm run build:lsp
    - name: Stage release extension version
      run: pnpm run version:stage
    - name: Verify and package VSIX
      id: package
      shell: bash
      run: |
        rm -f ./*.vsix
        pnpm run package:verify

        vsix_files="$(find . -maxdepth 1 -type f -name '*.vsix' | sort)"
        vsix_count="$(printf '%s\n' "${vsix_files}" | sed '/^$/d' | wc -l | tr -d ' ')"
        if [ "${vsix_count}" -ne 1 ]; then
          echo "::error::Expected exactly one VSIX, found ${vsix_count}."
          printf '%s\n' "${vsix_files}"
          exit 1
        fi

        vsix_path="${vsix_files}"
        echo "vsix_path=${vsix_path}" >> "${GITHUB_OUTPUT}"
        echo "vsix_name=${vsix_path#./}" >> "${GITHUB_OUTPUT}"
    - name: List packaged VSIX contents
      shell: bash
      run: unzip -l "${{ steps.package.outputs.vsix_path }}"
    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: vscode-release-vsix-${{ matrix.target }}
        path: src/vscode/${{ steps.package.outputs.vsix_name }}
        if-no-files-found: error

  draft-release:
    name: Create draft GitHub Release
    runs-on: ubuntu-latest
    needs:
    - validate
    - package
    if: ${{ needs.validate.outputs.should_release == 'true' }}
    permissions:
      actions: read
      contents: write
    steps:
    - name: Download VSIX release artifacts
      uses: actions/download-artifact@v5
      with:
        pattern: vscode-release-vsix-*
        path: ${{ runner.temp }}/vsix
        merge-multiple: true
    - name: Create manifest and checksums
      shell: pwsh
      env:
        RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      run: |
        $ErrorActionPreference = 'Stop'
        $releaseAssets = Join-Path $env:RUNNER_TEMP 'release-assets'
        New-Item -ItemType Directory -Force -Path $releaseAssets | Out-Null

        Get-ChildItem "$env:RUNNER_TEMP/vsix" -File -Filter '*.vsix' -Recurse | Copy-Item -Destination $releaseAssets
        $vsix = @(Get-ChildItem $releaseAssets -File -Filter '*.vsix')
        if ($vsix.Count -eq 0) {
            throw 'VS Code releases require at least one .vsix asset.'
        }

        $artifacts = @(Get-ChildItem $releaseAssets -File | Sort-Object Name | ForEach-Object {
            [ordered] @{
                name = $_.Name
                size = $_.Length
                sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
        })

        $manifest = [ordered] @{
            schema = 'nx.release-manifest.v1'
            track = 'vscode'
            tag = $env:RELEASE_TAG
            version = $env:RELEASE_VERSION
            commit = $env:GITHUB_SHA
            artifacts = $artifacts
        }

        $manifestPath = Join-Path $releaseAssets 'release-manifest.json'
        $checksumPath = Join-Path $releaseAssets 'release-checksums.txt'
        $manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $manifestPath
        $artifacts | ForEach-Object { "$($_.sha256)  $($_.name)" } | Set-Content -LiteralPath $checksumPath
    - name: Create or update draft release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      run: |
        set -euo pipefail

        notes="${RUNNER_TEMP}/release-notes.md"
        cat > "${notes}" <<EOF
        Draft VS Code extension release for ${RELEASE_TAG}.

        Review the attached VSIX, manifest, and checksum assets before publishing this GitHub Release.
        Publishing the release triggers Marketplace and Open VSX publication.
        EOF

        if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
          is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft')"
          if [ "${is_draft}" != "true" ]; then
            echo "::error::Release ${RELEASE_TAG} already exists and is not a draft."
            exit 1
          fi
          gh release edit "${RELEASE_TAG}" --draft=true --title "NX VS Code extension ${RELEASE_VERSION}" --notes-file "${notes}"
        else
          gh release create "${RELEASE_TAG}" --draft --title "NX VS Code extension ${RELEASE_VERSION}" --notes-file "${notes}"
        fi

        gh release upload "${RELEASE_TAG}" "${RUNNER_TEMP}/release-assets/"* --clobber
