# Deploys the NX Playground (sites/playground) to its Cloudflare Worker, `nxlang-playground`, which
# serves https://nxlang.org/playground and everything under it. A push to `main` is built and tested
# here, the WebAssembly compiler included, and the built files are uploaded with `wrangler deploy`.
# A Workers deploy is atomic, so the previous version keeps serving until every file of the new one
# is in place. Setup (API token, secrets, routes) is in docs/deployment-setup.md.

name: Deploy Playground

on:
  push:
    branches:
      - main
    # The site and every workspace package its build reads.
    paths:
      - sites/playground/**
      - packages/**
      - bindings/wasm/**
      - runtime/typescript/**
      - crates/**
      - src/vscode/**
      # The wasm build fetches the WASI sysroot by the version and checksum pinned here.
      - scripts/fetch-wasi-sysroot.mjs
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/deploy-playground.yml
      - .github/actions/setup-rust-node/action.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-playground
  cancel-in-progress: false

env:
  SITE_URL: https://nxlang.org/playground
  WRANGLER_VERSION: 4.141.0

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      # The WebAssembly module is built from source by `pnpm -r build`, against the workspace this
      # sets up: the wasm target, clang, and the pinned WASI sysroot the build fetches itself.
      - name: Set up Rust and the pnpm workspace
        uses: ./.github/actions/setup-rust-node

      - name: Build the workspace
        run: pnpm -r build

      - name: Test the workspace
        run: pnpm -r test

      - name: Typecheck the site
        run: pnpm --filter @nx-lang/playground typecheck

      # What the deploy job uploads, so it deploys exactly the files these tests ran against.
      - name: Keep the built site
        uses: actions/upload-artifact@v4
        with:
          name: playground-dist
          path: sites/playground/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://nxlang.org/playground

    steps:
      # For wrangler.jsonc and the Worker script beside the built files.
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Fetch the built site
        uses: actions/download-artifact@v4
        with:
          name: playground-dist
          path: sites/playground/dist

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Deploy to Cloudflare
        working-directory: sites/playground
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --message "main ${GITHUB_SHA}"

      # The shell must name this build's entry script, and the compiler module this build produced
      # must answer, so an old version still serving fails the check.
      - name: Smoke-test the site
        working-directory: sites/playground
        run: |
          set -euo pipefail
          entry=$(grep -o 'assets/index-[^"]*\.js' dist/playground/index.html | head -1)
          compiler=$(cd dist/playground && find assets -name "nx-*.wasm" | head -1)
          for attempt in $(seq 1 12); do
            shell=$(curl -sS --max-time 15 -A "nx-playground-deploy" "$SITE_URL" || true)
            module=$(curl -sS --max-time 30 -A "nx-playground-deploy" -o /dev/null -w '%{http_code} %{content_type}' "$SITE_URL/$compiler" || true)
            echo "shell names ${entry}: $(grep -cF "$entry" <<< "$shell" || true); ${compiler}: ${module:-no answer} ($attempt/12)"
            if grep -qF "$entry" <<< "$shell" && [ "$module" = "200 application/wasm" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::$SITE_URL did not serve the new build after the deployment"
          exit 1

      - name: Write the deployment summary
        if: always()
        run: |
          {
            echo "Playground deployment of \`${GITHUB_SHA}\`: ${{ job.status }}."
            echo ""
            echo "- Site: ${SITE_URL}"
            echo "- Roll back from sites/playground: \`npx wrangler@${WRANGLER_VERSION} rollback\` (see docs/deployment.md)."
          } >> "$GITHUB_STEP_SUMMARY"
