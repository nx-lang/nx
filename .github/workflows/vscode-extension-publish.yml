name: Publish VS Code extension

on:
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published VS Code GitHub Release tag to publish or repair
        type: string
        required: true

permissions:
  contents: read

jobs:
  prepare:
    name: Validate VS Code release
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
    - name: Validate release tag
      id: release
      shell: bash
      env:
        DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        tag="${DISPATCH_RELEASE_TAG:-${EVENT_RELEASE_TAG}}"
        if [[ -z "${tag}" ]]; then
          echo "::error::release_tag is required."
          exit 1
        fi

        if [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Package release ${tag} is handled by package-publish.yml; skipping VS Code extension publish."
          {
            echo "should_publish=false"
            echo "tag=${tag}"
            echo "version="
          } >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        if [[ ! "${tag}" =~ ^vscode-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
          echo "::error::VS Code extension releases must match vscode-v<major>.<minor>.<patch>. Actual tag: ${tag}."
          exit 1
        fi

        is_draft="$(gh release view "${tag}" --json isDraft --jq '.isDraft')"
        if [ "${is_draft}" != "false" ]; then
          echo "::error::VS Code release ${tag} must be published before registry publication."
          exit 1
        fi

        {
          echo "should_publish=true"
          echo "tag=${tag}"
          echo "version=${tag#vscode-v}"
        } >> "${GITHUB_OUTPUT}"

  publish-production:
    name: Publish VS Code extension
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ needs.prepare.outputs.should_publish == 'true' }}
    environment: production
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        package_json_file: src/vscode/package.json
        run_install: false
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: src/vscode/pnpm-lock.yaml
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      working-directory: src/vscode
    - name: Download release assets
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/release-assets"
        gh release download "${RELEASE_TAG}" -R "${GITHUB_REPOSITORY}" -D "${RUNNER_TEMP}/release-assets" --clobber
        find "${RUNNER_TEMP}/release-assets" -maxdepth 1 -type f -print | sort
    - name: Validate release assets
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $assets = Join-Path $env:RUNNER_TEMP 'release-assets'
        $manifestPath = Join-Path $assets 'release-manifest.json'
        $checksumPath = Join-Path $assets 'release-checksums.txt'

        if (!(Test-Path $manifestPath) -or !(Test-Path $checksumPath)) {
            throw 'Release assets must include release-manifest.json and release-checksums.txt.'
        }

        $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
        if ($manifest.schema -ne 'nx.release-manifest.v1' -or $manifest.track -ne 'vscode' -or $manifest.tag -ne $env:RELEASE_TAG -or $manifest.version -ne $env:RELEASE_VERSION) {
            throw 'Release manifest does not match the VS Code release being published.'
        }

        Push-Location $assets
        try {
            sha256sum -c release-checksums.txt
        } finally {
            Pop-Location
        }

        $vsixFiles = @(Get-ChildItem $assets -File -Filter '*.vsix')
        if ($vsixFiles.Count -eq 0) {
            throw 'VS Code releases must include at least one VSIX asset.'
        }

        foreach ($vsix in $vsixFiles) {
            $manifestJson = unzip -p $vsix.FullName extension/package.json | ConvertFrom-Json
            if ($manifestJson.name -ne 'nx-language' -or $manifestJson.publisher -ne 'nx-lang') {
                throw "VSIX '$($vsix.Name)' does not contain the expected nx-lang.nx-language extension identity."
            }

            if ($manifestJson.version -ne $env:RELEASE_VERSION) {
                throw "VSIX '$($vsix.Name)' version '$($manifestJson.version)' does not match release version '$env:RELEASE_VERSION'."
            }
        }
    - name: Check publishing secrets
      shell: bash
      env:
        OVSX_PAT: ${{ secrets.OVSX_PAT }}
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
      run: |
        missing=0
        if [ -z "${VSCE_PAT}" ]; then
          echo "::error::VSCE_PAT secret is required to publish to the Visual Studio Marketplace."
          missing=1
        fi

        if [ -z "${OVSX_PAT}" ]; then
          echo "::error::OVSX_PAT secret is required to publish to Open VSX."
          missing=1
        fi

        exit "${missing}"
    - name: Publish to Visual Studio Marketplace
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
      run: |
        for vsix in "${RUNNER_TEMP}"/release-assets/*.vsix; do
          pnpm run publish:vsce -- "$vsix"
        done
      working-directory: src/vscode
    - name: Publish to Open VSX
      env:
        OVSX_PAT: ${{ secrets.OVSX_PAT }}
      run: |
        for vsix in "${RUNNER_TEMP}"/release-assets/*.vsix; do
          pnpm run publish:ovsx -- "$vsix"
        done
      working-directory: src/vscode
