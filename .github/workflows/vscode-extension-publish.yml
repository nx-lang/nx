name: 🚀 Publish VS Code extension

on:
  workflow_run:
    workflows:
      - VS Code Extension
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful VS Code Extension workflow run ID containing VSIX artifacts to publish
        type: string
        required: true

permissions:
  contents: read

jobs:
  prepare:
    name: 🔎 Validate source artifacts
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    permissions:
      actions: read
      contents: read
    outputs:
      source_run_id: ${{ steps.source.outputs.source_run_id }}
      source_head_sha: ${{ steps.source.outputs.source_head_sha }}
      vsix_artifact_count: ${{ steps.source.outputs.vsix_artifact_count }}
    steps:
      - name: 🔎 Validate source VS Code Extension run
        id: source
        env:
          DISPATCH_ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            source_run_id="${WORKFLOW_RUN_ID}"
          else
            source_run_id="${DISPATCH_ARTIFACT_RUN_ID}"
          fi

          if [ -z "${source_run_id}" ]; then
            echo "::error::artifact_run_id is required."
            exit 1
          fi

          IFS=$'\t' read -r status conclusion head_sha workflow_path head_repository head_branch source_event < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}" \
              --jq '[.status, .conclusion, .head_sha, .path, .head_repository.full_name, .head_branch, .event] | @tsv'
          )

          if [ "${status}" != "completed" ] || [ "${conclusion}" != "success" ]; then
            echo "::error::Source VS Code Extension run ${source_run_id} must be completed successfully. Status: ${status}; conclusion: ${conclusion}."
            exit 1
          fi

          if [ "${workflow_path}" != ".github/workflows/vscode-extension.yml" ]; then
            echo "::error::Source run ${source_run_id} must come from .github/workflows/vscode-extension.yml. Source workflow: ${workflow_path}."
            exit 1
          fi

          if [ "${head_repository}" != "${GITHUB_REPOSITORY}" ]; then
            echo "::error::Source run ${source_run_id} must come from ${GITHUB_REPOSITORY}. Source repository: ${head_repository}."
            exit 1
          fi

          if [ "${head_branch}" != "main" ]; then
            echo "::error::Production VS Code extension publishing requires a source run from main. Source branch: ${head_branch}."
            exit 1
          fi

          artifact_names=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}/artifacts" --paginate --jq '.artifacts[].name')
          vsix_artifact_names=$(grep -E '^vscode-vsix-' <<<"${artifact_names}" || true)
          vsix_artifact_count=$(sed '/^$/d' <<<"${vsix_artifact_names}" | wc -l | tr -d ' ')
          if [ "${vsix_artifact_count}" -eq 0 ]; then
            echo "::error::Source run ${source_run_id} must contain at least one vscode-vsix-* artifact."
            exit 1
          fi

          {
            echo "source_run_id=${source_run_id}"
            echo "source_head_sha=${head_sha}"
            echo "vsix_artifact_count=${vsix_artifact_count}"
          } >> "$GITHUB_OUTPUT"
          printf 'Found VSIX artifacts:\n%s\n' "${vsix_artifact_names}"
          echo "Using VSIX artifacts from VS Code Extension run ${source_run_id} at ${head_sha} (${source_event}, ${head_branch})."

  publish-production:
    name: 🚀 Publish VS Code extension
    runs-on: ubuntu-latest
    needs: prepare
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: src/vscode/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: src/vscode/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: src/vscode

      - name: Download VSIX artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: vscode-vsix-*
          path: src/vscode/dist/vsix
          merge-multiple: true
          run-id: ${{ needs.prepare.outputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Verify downloaded VSIX artifacts
        shell: bash
        run: |
          expected_vsix_count="${{ needs.prepare.outputs.vsix_artifact_count }}"
          vsix_count="$(find dist/vsix -maxdepth 1 -type f -name '*.vsix' | wc -l | tr -d ' ')"
          if [ "${vsix_count}" -ne "${expected_vsix_count}" ]; then
            echo "::error::Expected ${expected_vsix_count} VSIX files, found ${vsix_count}."
            find dist/vsix -maxdepth 1 -type f -print | sort
            exit 1
          fi

          find dist/vsix -maxdepth 1 -type f -name '*.vsix' -print | sort
        working-directory: src/vscode

      - name: Check publishing secrets
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          missing=0
          if [ -z "${VSCE_PAT}" ]; then
            echo "::error::VSCE_PAT secret is required to publish to the Visual Studio Marketplace."
            missing=1
          fi

          if [ -z "${OVSX_PAT}" ]; then
            echo "::error::OVSX_PAT secret is required to publish to Open VSX."
            missing=1
          fi

          exit "${missing}"

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          for vsix in dist/vsix/*.vsix; do
            pnpm run publish:vsce -- "$vsix"
          done
        working-directory: src/vscode

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          for vsix in dist/vsix/*.vsix; do
            pnpm run publish:ovsx -- "$vsix"
          done
        working-directory: src/vscode
