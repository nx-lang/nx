name: 🚀 Package release

on:
  workflow_run:
    workflows:
    - 🏭 Build
    types:
    - completed
    branches:
    - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to publish to
        type: choice
        options:
        - preview
        - production
        default: preview
      artifact_run_id:
        description: Successful Build workflow run ID containing artifacts to publish
        type: string
        required: true

permissions:
  contents: read

jobs:
  prepare:
    name: 🔎 Validate source artifacts
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    permissions:
      actions: read
      contents: read
    outputs:
      source_run_id: ${{ steps.source.outputs.source_run_id }}
      source_head_sha: ${{ steps.source.outputs.source_head_sha }}
      target_environment: ${{ steps.source.outputs.target_environment }}
    steps:
    - name: 🔎 Validate source Build run
      id: source
      env:
        GH_TOKEN: ${{ github.token }}
        DISPATCH_ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        DISPATCH_TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
      run: |
        if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
          source_run_id="${WORKFLOW_RUN_ID}"
          target_environment="production"
        else
          source_run_id="${DISPATCH_ARTIFACT_RUN_ID}"
          target_environment="${DISPATCH_TARGET_ENVIRONMENT}"
        fi

        if [ -z "${source_run_id}" ]; then
          echo "::error::artifact_run_id is required."
          exit 1
        fi

        if [ "${target_environment}" != "preview" ] && [ "${target_environment}" != "production" ]; then
          echo "::error::target_environment must be preview or production."
          exit 1
        fi

        IFS=$'\t' read -r status conclusion head_sha workflow_path head_repository head_branch source_event < <(
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}" \
            --jq '[.status, .conclusion, .head_sha, .path, .head_repository.full_name, .head_branch, .event] | @tsv'
        )

        if [ "${status}" != "completed" ] || [ "${conclusion}" != "success" ]; then
          echo "::error::Source Build run ${source_run_id} must be completed successfully. Status: ${status}; conclusion: ${conclusion}."
          exit 1
        fi

        if [ "${workflow_path}" != ".github/workflows/build.yml" ]; then
          echo "::error::Source run ${source_run_id} must come from .github/workflows/build.yml. Source workflow: ${workflow_path}."
          exit 1
        fi

        if [ "${head_repository}" != "${GITHUB_REPOSITORY}" ]; then
          echo "::error::Source run ${source_run_id} must come from ${GITHUB_REPOSITORY}. Source repository: ${head_repository}."
          exit 1
        fi

        if [ "${target_environment}" = "production" ] && [ "${head_branch}" != "main" ]; then
          echo "::error::Production publishing requires a source Build run from main. Source branch: ${head_branch}."
          exit 1
        fi

        artifact_names=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}/artifacts" --paginate --jq '.artifacts[].name')
        if ! grep -Fxq "deployables-Complete" <<<"${artifact_names}" || ! grep -Fxq "editor-assets-package" <<<"${artifact_names}"; then
          echo "::error::Source Build run ${source_run_id} must contain deployables-Complete and editor-assets-package artifacts."
          exit 1
        fi

        {
          echo "source_run_id=${source_run_id}"
          echo "source_head_sha=${head_sha}"
          echo "target_environment=${target_environment}"
        } >> "$GITHUB_OUTPUT"
        echo "Using ${target_environment} artifacts from Build run ${source_run_id} at ${head_sha} (${source_event}, ${head_branch})."

  publish-preview:
    name: 🚀 Publish preview packages
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ needs.prepare.outputs.target_environment == 'preview' }}
    environment: preview
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
    - name: 🔻 Download complete deployables
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: deployables-Complete
        path: ${{ runner.temp }}/deployables
        run-id: ${{ needs.prepare.outputs.source_run_id }}
        github-token: ${{ github.token }}
    - name: 🔻 Download editor-assets package
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: editor-assets-package
        path: ${{ runner.temp }}/editor-assets
        run-id: ${{ needs.prepare.outputs.source_run_id }}
        github-token: ${{ github.token }}
    - name: 🚀 Publish preview NuGet package
      shell: pwsh
      env:
        PREVIEW_NUGET_SOURCE: ${{ vars.PREVIEW_NUGET_SOURCE }}
        PREVIEW_NUGET_API_KEY: ${{ secrets.PREVIEW_NUGET_API_KEY }}
      run: |
        if (!$env:PREVIEW_NUGET_SOURCE) {
          Write-Host "PREVIEW_NUGET_SOURCE is not configured; skipping preview NuGet publish."
          return
        }

        $package = Get-ChildItem '${{ runner.temp }}/deployables/NxLang.Runtime.*.nupkg' | Select-Object -First 1
        $apiKeyArgs = @()
        if ($env:PREVIEW_NUGET_API_KEY) {
          $apiKeyArgs = @('--api-key', $env:PREVIEW_NUGET_API_KEY)
        }

        dotnet nuget push $package.FullName --source $env:PREVIEW_NUGET_SOURCE --skip-duplicate @apiKeyArgs
    - name: 🚀 Publish preview editor-assets package
      env:
        PREVIEW_NPM_REGISTRY: ${{ vars.PREVIEW_NPM_REGISTRY }}
        NODE_AUTH_TOKEN: ${{ secrets.PREVIEW_NPM_TOKEN }}
      run: |
        if [ -z "${PREVIEW_NPM_REGISTRY}" ]; then
          echo "PREVIEW_NPM_REGISTRY is not configured; skipping preview npm publish."
          exit 0
        fi

        if [ -n "${NODE_AUTH_TOKEN}" ]; then
          registry="${PREVIEW_NPM_REGISTRY%/}"
          registry_key="${registry#https://}"
          registry_key="${registry_key#http://}"
          echo "//${registry_key}/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
        fi

        package=$(find "${{ runner.temp }}/editor-assets" -maxdepth 1 -name '*.tgz' -type f -print -quit)
        npm publish "$package" --access public --registry "${PREVIEW_NPM_REGISTRY}"

  publish-production:
    name: 🚀 Publish production packages
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ needs.prepare.outputs.target_environment == 'production' }}
    environment: production
    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      with:
        fetch-depth: 0
    - name: 🔻 Download complete deployables
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: deployables-Complete
        path: ${{ runner.temp }}/deployables
        run-id: ${{ needs.prepare.outputs.source_run_id }}
        github-token: ${{ github.token }}
    - name: 🔻 Download editor-assets package
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: editor-assets-package
        path: ${{ runner.temp }}/editor-assets
        run-id: ${{ needs.prepare.outputs.source_run_id }}
        github-token: ${{ github.token }}
    - name: 🔎 Check NuGet version
      shell: pwsh
      run: |
        $package = Get-ChildItem '${{ runner.temp }}/deployables/NxLang.Runtime.*.nupkg' | Select-Object -First 1
        tools/packaging/Test-NuGetPackageVersionAvailable.ps1 -PackagePath $package.FullName
    - name: 🔎 Check npm version
      id: npm-version
      run: |
        package=$(find "${{ runner.temp }}/editor-assets" -maxdepth 1 -name '*.tgz' -type f -print -quit)
        name=$(node -e "const p=require('child_process').execFileSync('tar',['-xOf',process.argv[1],'package/package.json'],{encoding:'utf8'}); console.log(JSON.parse(p).name)" "$package")
        package_version=$(node -e "const p=require('child_process').execFileSync('tar',['-xOf',process.argv[1],'package/package.json'],{encoding:'utf8'}); console.log(JSON.parse(p).version)" "$package")
        if npm view "${name}@${package_version}" version >/dev/null 2>&1; then
          echo "::warning::${name}@${package_version} already exists on npm; treating this run as an idempotent retry."
          echo "exists=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "exists=false" >> "$GITHUB_OUTPUT"
        echo "npm package ${name}@${package_version} is available."
    - name: Check NuGet authentication
      id: nuget-auth
      shell: pwsh
      env:
        FALLBACK_NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        if ($env:NUGET_USER) {
          "use_trusted=true" >> $env:GITHUB_OUTPUT
        } elseif ($env:FALLBACK_NUGET_API_KEY) {
          "use_trusted=false" >> $env:GITHUB_OUTPUT
        } else {
          Write-Error "NuGet publishing requires NuGet trusted publishing (NUGET_USER) or NUGET_API_KEY fallback."
        }
    - name: NuGet login
      id: nuget-login
      uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
      if: ${{ steps.nuget-auth.outputs.use_trusted == 'true' }}
      with:
        user: ${{ env.NUGET_USER }}
    - name: 🚀 Publish NuGet package
      shell: pwsh
      env:
        TRUSTED_NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        FALLBACK_NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        $apiKey = if ($env:TRUSTED_NUGET_API_KEY) { $env:TRUSTED_NUGET_API_KEY } else { $env:FALLBACK_NUGET_API_KEY }
        $package = Get-ChildItem '${{ runner.temp }}/deployables/NxLang.Runtime.*.nupkg' | Select-Object -First 1
        dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json --api-key $apiKey --skip-duplicate
    - name: Setup Node.js for npm trusted publishing
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'
        cache: ''
    - name: Check npm trusted publishing support
      shell: bash
      run: |
        npm_version="$(npm --version)"
        if node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)" "${npm_version}"; then
          echo "Using npm trusted publishing with npm ${npm_version}."
        else
          echo "::error::Production npm publishing requires trusted publishing with npm >= 11.5.1. Current npm: ${npm_version}."
          exit 1
        fi
    - name: 🚀 Publish editor-assets package
      if: ${{ steps.npm-version.outputs.exists != 'true' }}
      run: |
        package=$(find "${{ runner.temp }}/editor-assets" -maxdepth 1 -name '*.tgz' -type f -print -quit)
        npm publish "$package" --access public
