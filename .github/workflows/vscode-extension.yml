# Builds the VSIX files for pull requests and main, so reviewers can install them from the run's
# artifacts; pr-artifact-comment.yml posts the install commands. release.yml builds the release VSIX
# files with the same reusable workflow.

name: VS Code Extension

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/vscode/**'
      - 'crates/nx-language-service/**'
      - 'crates/nx-lsp/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/vscode-extension.yml'
      - '.github/workflows/vscode-vsix.yml'
      - 'tools/versions/**'
      - '.github/workflows/pr-artifact-comment.yml'
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/vscode-vsix.yml
