name: VS Code Extension

on:
  pull_request:
    paths:
      - 'src/vscode/**'
      - '.github/workflows/vscode-extension.yml'
  push:
    branches: [ main ]
    tags:
      - 'vscode-v*' # Tag with this pattern to build a .vsix artifact

jobs:
  verify:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/vscode-v') }}
    defaults:
      run:
        working-directory: src/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: src/vscode/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: src/vscode/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package
        run: pnpm run package:verify

  publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    defaults:
      run:
        working-directory: src/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: src/vscode/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: src/vscode/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag matches extension version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="vscode-v${package_version}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match src/vscode/package.json version ${package_version}. Expected ${expected_tag}."
            exit 1
          fi

      - name: Check publishing secrets
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          missing=0
          if [ -z "${VSCE_PAT}" ]; then
            echo "::error::VSCE_PAT secret is required to publish to the Visual Studio Marketplace."
            missing=1
          fi

          if [ -z "${OVSX_PAT}" ]; then
            echo "::error::OVSX_PAT secret is required to publish to Open VSX."
            missing=1
          fi

          exit "${missing}"

      - name: Verify and package VSIX
        id: package
        shell: bash
        run: |
          rm -f ./*.vsix
          pnpm run package:verify

          mapfile -t vsix_files < <(find . -maxdepth 1 -type f -name '*.vsix' | sort)
          if [ "${#vsix_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one VSIX, found ${#vsix_files[@]}."
            printf '%s\n' "${vsix_files[@]}"
            exit 1
          fi

          vsix_path="${vsix_files[0]}"
          echo "vsix_path=${vsix_path}" >> "$GITHUB_OUTPUT"
          echo "vsix_name=${vsix_path#./}" >> "$GITHUB_OUTPUT"

      - name: List packaged VSIX contents
        shell: bash
        run: unzip -l "${{ steps.package.outputs.vsix_path }}"

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.vsix_name }}
          path: src/vscode/${{ steps.package.outputs.vsix_name }}
          if-no-files-found: error

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm run publish:vsce -- "${{ steps.package.outputs.vsix_path }}"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm run publish:ovsx -- "${{ steps.package.outputs.vsix_path }}"
