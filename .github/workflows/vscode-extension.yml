name: VS Code Extension

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/vscode/**'
      - 'crates/nx-language-service/**'
      - 'crates/nx-lsp/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/vscode-extension.yml'
      - '.github/workflows/vscode-extension-publish.yml'
      - '.github/workflows/vscode-release.yml'
      - '.github/workflows/pr-artifact-comment.yml'
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: darwin-arm64
            os: macos-14
          - target: win32-x64
            os: windows-latest
    env:
      NX_LSP_PLATFORM: ${{ matrix.target }}
      NX_VSCODE_TARGET: ${{ matrix.target }}
    defaults:
      run:
        working-directory: src/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: src/vscode/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: src/vscode/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore .NET tools
        run: dotnet tool restore
        working-directory: .

      - name: Calculate VS Code extension version
        shell: pwsh
        run: >
          tools/versions/Get-ReleaseVersion.ps1
          -Track vscode
          -PullRequestNumber '${{ github.event.pull_request.number }}'
          -GitHubEnvPath $env:GITHUB_ENV
        working-directory: .

      - name: Build Rust language server
        run: pnpm run build:lsp

      - name: Stage CI extension version
        run: pnpm run version:stage

      - name: Verify and package VSIX
        id: package
        shell: bash
        run: |
          rm -f ./*.vsix
          pnpm run package:verify

          vsix_files="$(find . -maxdepth 1 -type f -name '*.vsix' | sort)"
          vsix_count="$(printf '%s\n' "${vsix_files}" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "${vsix_count}" -ne 1 ]; then
            echo "::error::Expected exactly one VSIX, found ${vsix_count}."
            printf '%s\n' "${vsix_files}"
            exit 1
          fi

          vsix_path="${vsix_files}"
          echo "vsix_path=${vsix_path}" >> "$GITHUB_OUTPUT"
          echo "vsix_name=${vsix_path#./}" >> "$GITHUB_OUTPUT"

      - name: List packaged VSIX contents
        shell: bash
        run: unzip -l "${{ steps.package.outputs.vsix_path }}"

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-vsix-${{ matrix.target }}
          path: src/vscode/${{ steps.package.outputs.vsix_name }}
          if-no-files-found: error

  vscode-pr-metadata:
    name: PR VSIX test commands
    runs-on: ubuntu-latest
    needs: package
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Calculate VS Code extension version
        id: versions
        shell: pwsh
        run: >
          tools/versions/Get-ReleaseVersion.ps1
          -Track vscode
          -PullRequestNumber '${{ github.event.pull_request.number }}'
          -GitHubOutputPath $env:GITHUB_OUTPUT

      - name: Generate VSIX test metadata
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          VSCODE_EXTENSION_VERSION: ${{ steps.versions.outputs.vscode_extension_version }}
        run: |
          mkdir -p pr-test-commands
          vsix_download="gh run download ${RUN_ID} -R ${REPOSITORY} -p 'vscode-vsix-*' -D nx-vsix-artifacts"
          vsix_install="find nx-vsix-artifacts -name '*.vsix' -type f -print0 | xargs -0 -I{} code --install-extension '{}' --force"

          jq -n \
            --arg schema "nx.vscode-pr-artifacts.v1" \
            --arg repository "${REPOSITORY}" \
            --argjson pullRequest "${PR_NUMBER}" \
            --argjson runId "${RUN_ID}" \
            --arg version "${VSCODE_EXTENSION_VERSION}" \
            --arg vsixDownload "${vsix_download}" \
            --arg vsixInstall "${vsix_install}" \
            '{
              schema: $schema,
              repository: $repository,
              pullRequest: $pullRequest,
              runId: $runId,
              artifacts: {
                vsixPattern: "vscode-vsix-*"
              },
              versions: {
                vscode: $version
              },
              commands: {
                vsix: [$vsixDownload, $vsixInstall]
              }
            }' > pr-test-commands/metadata.json

      - name: Upload VSIX test metadata
        uses: actions/upload-artifact@v4
        with:
          name: vscode-pr-test-commands
          path: pr-test-commands/metadata.json
          if-no-files-found: error
