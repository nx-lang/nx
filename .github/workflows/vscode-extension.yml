name: VS Code Extension

on:
  workflow_dispatch:
    inputs:
      repair_run_id:
        description: Workflow run ID containing VSIX artifacts to republish
        required: false
  pull_request:
    paths:
      - 'src/vscode/**'
      - 'crates/nx-language-service/**'
      - 'crates/nx-lsp/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/vscode-extension.yml'
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.repair_run_id == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: darwin-x64
            os: macos-13
          - target: win32-x64
            os: windows-latest
    env:
      NX_LSP_PLATFORM: ${{ matrix.target }}
      NX_VSCODE_TARGET: ${{ matrix.target }}
    defaults:
      run:
        working-directory: src/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: src/vscode/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: src/vscode/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore .NET tools
        run: dotnet tool restore
        working-directory: .

      - name: Build Rust language server
        run: pnpm run build:lsp

      - name: Stage CI extension version
        run: pnpm run version:stage

      - name: Verify and package VSIX
        id: package
        shell: bash
        run: |
          rm -f ./*.vsix
          pnpm run package:verify

          mapfile -t vsix_files < <(find . -maxdepth 1 -type f -name '*.vsix' | sort)
          if [ "${#vsix_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one VSIX, found ${#vsix_files[@]}."
            printf '%s\n' "${vsix_files[@]}"
            exit 1
          fi

          vsix_path="${vsix_files[0]}"
          echo "vsix_path=${vsix_path}" >> "$GITHUB_OUTPUT"
          echo "vsix_name=${vsix_path#./}" >> "$GITHUB_OUTPUT"

      - name: List packaged VSIX contents
        shell: bash
        run: unzip -l "${{ steps.package.outputs.vsix_path }}"

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-vsix-${{ matrix.target }}
          path: src/vscode/${{ steps.package.outputs.vsix_name }}
          if-no-files-found: error

  publish:
    name: Publish VS Code extension
    runs-on: ubuntu-latest
    needs: package
    if: ${{ always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.package.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.repair_run_id != '')) }}
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: src/vscode/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: src/vscode/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: src/vscode

      - name: Download VSIX artifacts
        if: ${{ inputs.repair_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: vscode-vsix-*
          path: src/vscode/dist/vsix
          merge-multiple: true

      - name: Download repair VSIX artifacts
        if: ${{ inputs.repair_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: vscode-vsix-*
          path: src/vscode/dist/vsix
          merge-multiple: true
          run-id: ${{ inputs.repair_run_id }}
          github-token: ${{ github.token }}

      - name: Check publishing secrets
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          missing=0
          if [ -z "${VSCE_PAT}" ]; then
            echo "::error::VSCE_PAT secret is required to publish to the Visual Studio Marketplace."
            missing=1
          fi

          if [ -z "${OVSX_PAT}" ]; then
            echo "::error::OVSX_PAT secret is required to publish to Open VSX."
            missing=1
          fi

          exit "${missing}"

      - name: Check extension versions
        if: ${{ inputs.repair_run_id == '' }}
        run: |
          for vsix in dist/vsix/*.vsix; do
            pnpm run version:check:vsix -- "$vsix"
          done
        working-directory: src/vscode

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          for vsix in dist/vsix/*.vsix; do
            pnpm run publish:vsce -- "$vsix"
          done
        working-directory: src/vscode

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          for vsix in dist/vsix/*.vsix; do
            pnpm run publish:ovsx -- "$vsix"
          done
        working-directory: src/vscode
