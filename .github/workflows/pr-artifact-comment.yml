name: PR artifact comments

on:
  workflow_run:
    workflows:
    - 🏭 Build
    - VS Code Extension
    types:
    - completed

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  comment:
    name: Update PR artifact comment
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    concurrency:
      group: pr-artifact-comment-${{ github.event.workflow_run.path }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
    - name: Update artifact comment
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        repository="$(jq -r ".repository.full_name" "${GITHUB_EVENT_PATH}")"
        run_id="$(jq -r ".workflow_run.id" "${GITHUB_EVENT_PATH}")"
        workflow_path="$(jq -r ".workflow_run.path" "${GITHUB_EVENT_PATH}")"
        head_repository="$(jq -r ".workflow_run.head_repository.full_name // empty" "${GITHUB_EVENT_PATH}")"
        head_branch="$(jq -r ".workflow_run.head_branch // empty" "${GITHUB_EVENT_PATH}")"
        work_dir="${RUNNER_TEMP}/pr-artifact-comment"
        mkdir -p "${work_dir}"

        pr_number="$(jq -r ".workflow_run.pull_requests[0].number // empty" "${GITHUB_EVENT_PATH}")"

        if [ -z "${pr_number}" ]; then
          pr_number="$(gh api "repos/${repository}/actions/runs/${run_id}/pull_requests" --jq ".[0].number // empty")"
        fi

        if [ -z "${pr_number}" ] && [ -n "${head_repository}" ] && [ -n "${head_branch}" ]; then
          gh api "repos/${repository}/pulls?state=all" --paginate --jq ".[]" > "${work_dir}/pulls.ndjson"
          pr_number="$(jq -rs --arg repo "${head_repository}" --arg branch "${head_branch}" 'map(select(.head.repo.full_name == $repo and .head.ref == $branch))[0].number // empty' "${work_dir}/pulls.ndjson")"
        fi

        if [ -z "${pr_number}" ]; then
          echo "::warning::Unable to identify pull request for workflow run ${run_id}; nothing to comment."
          exit 0
        fi

        case "${workflow_path}" in
          .github/workflows/build.yml)
            comment_kind="packages"
            marker="<!-- nx-pr-artifacts:packages -->"
            ;;
          .github/workflows/vscode-extension.yml)
            comment_kind="vscode"
            marker="<!-- nx-pr-artifacts:vscode -->"
            ;;
          *)
            echo "Workflow ${workflow_path} does not produce PR artifact comments."
            exit 0
            ;;
        esac

        gh api "repos/${repository}/actions/runs/${run_id}/artifacts" --paginate --jq ".artifacts[]" > "${work_dir}/artifacts.ndjson"

        artifact_id_by_name() {
          local name="$1"
          jq -rs --arg name "${name}" 'map(select(.name == $name))[0].id // empty' "${work_dir}/artifacts.ndjson"
        }

        artifact_id_by_prefix() {
          local prefix="$1"
          jq -rs --arg prefix "${prefix}" 'map(select(.name | startswith($prefix)))[0].id // empty' "${work_dir}/artifacts.ndjson"
        }

        download_artifact() {
          local artifact_id="$1"
          local destination="$2"
          local zip_path="${work_dir}/artifact-${artifact_id}.zip"

          rm -rf "${destination}"
          mkdir -p "${destination}"
          gh api "repos/${repository}/actions/artifacts/${artifact_id}/zip" > "${zip_path}"
          unzip -q "${zip_path}" -d "${destination}"
        }

        first_matching_file() {
          local directory="$1"
          local pattern="$2"
          find "${directory}" -type f -name "${pattern}" | sort | sed -n '1p'
        }

        find_nuget_package_version() {
          local directory="$1"
          python3 - "${directory}" <<'PY'
        import sys
        import zipfile
        from pathlib import Path
        import xml.etree.ElementTree as ET

        directory = Path(sys.argv[1])
        target_id = "NxLang.Runtime"
        matches = []

        for package_path in sorted(directory.rglob("*.nupkg")):
            with zipfile.ZipFile(package_path) as package:
                nuspec_names = [name for name in package.namelist() if name.endswith(".nuspec")]
                if len(nuspec_names) != 1:
                    print(f"::error::{package_path} has {len(nuspec_names)} nuspec files.", file=sys.stderr)
                    sys.exit(1)

                root = ET.fromstring(package.read(nuspec_names[0]))

            namespace = ""
            if root.tag.startswith("{"):
                namespace = root.tag.split("}", 1)[0] + "}"

            metadata = root.find(f"{namespace}metadata")
            if metadata is None:
                print(f"::error::{package_path} is missing nuspec metadata.", file=sys.stderr)
                sys.exit(1)

            package_id = (metadata.findtext(f"{namespace}id") or "").strip()
            version = (metadata.findtext(f"{namespace}version") or "").strip()

            if package_id == target_id:
                matches.append((package_path, version))

        if len(matches) != 1:
            print(f"::error::Expected exactly one {target_id} package, found {len(matches)}.", file=sys.stderr)
            sys.exit(1)

        package_path, version = matches[0]
        if not version:
            print(f"::error::{package_path} is missing a package version.", file=sys.stderr)
            sys.exit(1)

        print(version)
        PY
        }

        validate_semver() {
          local name="$1"
          local version="$2"
          local semver_regex='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$'

          if [[ ! "${version}" =~ ${semver_regex} ]]; then
            echo "::error::${name} version '${version}' is not valid SemVer."
            exit 1
          fi
        }

        body_path="${work_dir}/body.md"
        run_url="https://github.com/${repository}/actions/runs/${run_id}"

        if [ "${comment_kind}" = "packages" ]; then
          nuget_artifact_id="$(artifact_id_by_name "deployables-Complete")"
          npm_artifact_id="$(artifact_id_by_name "editor-assets-package")"

          if [ -z "${nuget_artifact_id}" ] || [ -z "${npm_artifact_id}" ]; then
            echo "Run ${run_id} did not upload package artifacts; nothing to comment."
            exit 0
          fi

          nuget_dir="${work_dir}/deployables-Complete"
          npm_dir="${work_dir}/editor-assets-package"
          download_artifact "${nuget_artifact_id}" "${nuget_dir}"
          download_artifact "${npm_artifact_id}" "${npm_dir}"

          npm_package_path="$(first_matching_file "${npm_dir}" "*.tgz")"

          if [ -z "${npm_package_path}" ]; then
            echo "::error::editor-assets-package is missing a .tgz package."
            exit 1
          fi

          package_version="$(find_nuget_package_version "${nuget_dir}")"
          npm_version="$(tar -xOf "${npm_package_path}" package/package.json | jq -r ".version // empty")"

          if [ -z "${package_version}" ] || [ -z "${npm_version}" ]; then
            echo "::error::Could not read package artifact versions."
            exit 1
          fi

          validate_semver "NuGet package" "${package_version}"
          validate_semver "editor-assets npm package" "${npm_version}"

          {
            printf "%s\n" "${marker}"
            printf "### NX package test artifacts\n\n"
            printf "Build run: [%s](%s)\n\n" "${run_id}" "${run_url}"
            printf "NuGet package version: \`%s\`\n" "${package_version}"
            printf "Editor-assets npm version: \`%s\`\n\n" "${npm_version}"
            printf "\`\`\`bash\n"
            printf "gh run download %s -R %s -n deployables-Complete -D nx-package-artifacts\n" "${run_id}" "${repository}"
            printf "dotnet new console -n nx-runtime-test\n"
            printf "dotnet add nx-runtime-test/nx-runtime-test.csproj package NxLang.Runtime --version %s --source \"\$(pwd)/nx-package-artifacts\"\n" "${package_version}"
            printf "\`\`\`\n\n"
            printf "\`\`\`bash\n"
            printf "gh run download %s -R %s -n editor-assets-package -D nx-editor-assets\n" "${run_id}" "${repository}"
            printf "mkdir nx-editor-assets-test\n"
            printf "cd nx-editor-assets-test\n"
            printf "npm init -y\n"
            printf "pnpm add ../nx-editor-assets/*.tgz\n"
            printf "\`\`\`\n"
          } > "${body_path}"
        else
          vsix_artifact_id="$(artifact_id_by_prefix "vscode-vsix-")"

          if [ -z "${vsix_artifact_id}" ]; then
            echo "Run ${run_id} did not upload VSIX artifacts; nothing to comment."
            exit 0
          fi

          vsix_dir="${work_dir}/vscode-vsix"
          download_artifact "${vsix_artifact_id}" "${vsix_dir}"
          vsix_path="$(first_matching_file "${vsix_dir}" "*.vsix")"

          if [ -z "${vsix_path}" ]; then
            echo "::error::VSIX artifact is missing a .vsix package."
            exit 1
          fi

          vscode_version="$(unzip -p "${vsix_path}" extension/package.json | jq -r ".version // empty")"

          if [ -z "${vscode_version}" ]; then
            echo "::error::Could not read VSIX package version."
            exit 1
          fi

          validate_semver "VSIX" "${vscode_version}"

          {
            printf "%s\n" "${marker}"
            printf "### NX VS Code extension test artifacts\n\n"
            printf "Build run: [%s](%s)\n\n" "${run_id}" "${run_url}"
            printf "VSIX version: \`%s\`\n\n" "${vscode_version}"
            printf "\`\`\`bash\n"
            printf "case \"\$(uname -s)-\$(uname -m)\" in\n"
            printf "  Linux-x86_64) vsix_target=linux-x64 ;;\n"
            printf "  Darwin-arm64) vsix_target=darwin-arm64 ;;\n"
            printf "  MINGW*|MSYS*|CYGWIN*) vsix_target=win32-x64 ;;\n"
            printf "  *) echo \"No VSIX target for this host.\"; exit 1 ;;\n"
            printf "esac\n"
            printf "gh run download %s -R %s -n \"vscode-vsix-\${vsix_target}\" -D nx-vsix-artifacts\n" "${run_id}" "${repository}"
            printf "vsix=\"\$(find nx-vsix-artifacts -name '*.vsix' -type f -print -quit)\"\n"
            printf "code --install-extension \"\${vsix}\" --force\n"
            printf "\`\`\`\n"
          } > "${body_path}"
        fi

        gh api "repos/${repository}/issues/${pr_number}/comments" --paginate --jq ".[]" > "${work_dir}/comments.ndjson"
        comment_id="$(jq -rs --arg marker "${marker}" 'map(select(.user.type == "Bot") | select(.body | contains($marker)))[0].id // empty' "${work_dir}/comments.ndjson")"
        jq -n --rawfile body "${body_path}" "{body: \$body}" > "${work_dir}/comment.json"

        if [ -n "${comment_id}" ]; then
          gh api -X PATCH "repos/${repository}/issues/comments/${comment_id}" --input "${work_dir}/comment.json" > /dev/null
          echo "Updated PR #${pr_number} artifact comment ${comment_id}."
        else
          gh api -X POST "repos/${repository}/issues/${pr_number}/comments" --input "${work_dir}/comment.json" > /dev/null
          echo "Created PR #${pr_number} artifact comment."
        fi
