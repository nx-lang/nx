[workspace]
resolver = "3"
members = [
    "crates/nx-diagnostics",
    "crates/nx-syntax",
    "crates/nx-hir",
    "crates/nx-types",
    "crates/nx-value",
    "crates/nx-ir",
    "crates/nx-ir-runtime",
    "crates/nx-api",
    "crates/nx-language-service",
    "crates/nx-lsp",
    "crates/nx-codegen",
    "crates/nx-cli",
    "crates/nx-interpreter",
    "crates/nx-ffi",
    "bindings/node/native",
    "bindings/wasm/native",
]

[workspace.package]
version = "0.1.0"
authors = ["The NX Authors"]
edition = "2021"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/nx-lang/nx"
homepage = "https://nxlang.org"

[workspace.dependencies]
# The crates published to crates.io, which depend on each other by version as well as by path.
# `scripts/pack-crates.mjs` pins both to the release's version when it packages them.
nx-ir = { path = "crates/nx-ir", version = "0.1.0" }
nx-value = { path = "crates/nx-value", version = "0.1.0" }

# Error reporting
ariadne = "0.6"
text-size = "1.1"

# Parsing
tree-sitter = "0.25.10"

# Documentation Markdown
pulldown-cmark = { version = "0.13", default-features = false }

# Data structures
smol_str = "0.3.4"
la-arena = "0.3.1"
rustc-hash = "2.1.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
url = "2.5"

# Incremental computation
salsa = "0.16"

# Async/runtime
tokio = "1.45"
tower-lsp = "0.20"

# Testing
insta = { version = "1.34", features = ["yaml"] }

[profile.release]
lto = "thin"
codegen-units = 1

# WebAssembly builds of the SDK module: release codegen with the name section stripped, so the
# module the playground ships is as small as the toolchain makes it without extra tooling.
[profile.wasm-release]
inherits = "release"
strip = true
